server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      # Nacos 未开启鉴权时不要配 username/password，否则客户端反复请求 /auth/login 报 500
      # 若在 conf/application.properties 里打开 nacos.core.auth.enabled=true，再放开下面两行
      # username: nacos
      # password: nacos
      discovery:
        namespace: public
        group: DEFAULT_GROUP
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: provider-route
          uri: lb://provider
          predicates:
            - Path=/provider/**
          filters:
            - StripPrefix=1
        - id: consumer-route
          uri: lb://consumer
          predicates:
            - Path=/consumer/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

---
# 没有启动 Nacos 时的本地单机模式：--spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
