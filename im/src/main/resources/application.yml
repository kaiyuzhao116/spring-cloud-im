server:
  port: 8085

spring:
  application:
    name: im
  datasource:
    # forceConnectionTimeZoneToSession=true：建连时执行 SET time_zone='+08:00'，
    # 否则 NOW()/CURRENT_TIMESTAMP 会用服务器的 UTC，落库时间比实际早 8 小时
    url: jdbc:mysql://127.0.0.1:3306/spring_cloud?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP
        # 本机开发固定注册 127.0.0.1：换 Wi-Fi/VPN 后 IP 变化会导致调用方连不上旧 IP
        ip: 127.0.0.1
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:im.yaml

# Dubbo Provider（对外提供消息/会话接口）+ HTTP 8085（联调用）
dubbo:
  application:
    name: im
    qos-enable: false
    register-mode: interface
  registry:
    address: nacos://127.0.0.1:8848
  protocol:
    name: dubbo
    port: 20883
    # 本机开发：Dubbo 广播地址固定回环，避免 IP 变化后消费方连不上
    host: 127.0.0.1
  scan:
    base-packages: com.song.im
  consumer:
    check: false
    timeout: 3000

# Outbox 投递器
im:
  outbox:
    # 定时扫表的间隔（毫秒）。
    # 主路径是"事务提交后立即唤醒"，扫表只在唤醒丢失、进程重启、MQ 恢复重试时兜底，
    # 所以这里可以放宽到 5 秒 —— 数据库开销降到 1/5，正常发消息的延迟不受影响。
    interval-ms: 5000

---
# 没有启动 Nacos 时的本地模式：--spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

dubbo:
  registry:
    address: N/A
