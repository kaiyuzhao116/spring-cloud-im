server:
  port: 8085

spring:
  application:
    name: im
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spring_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:im.yaml

# Dubbo Provider（对外提供消息/会话接口）+ HTTP 8085（联调用）
dubbo:
  application:
    name: im
    qos-enable: false
    register-mode: interface
  registry:
    address: nacos://127.0.0.1:8848
  protocol:
    name: dubbo
    port: 20883
  scan:
    base-packages: com.song.im
  consumer:
    check: false
    timeout: 3000

---
# 没有启动 Nacos 时的本地模式：--spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

dubbo:
  registry:
    address: N/A
