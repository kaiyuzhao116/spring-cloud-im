# 目标环境：腾讯云轻量 82.157.185.69（3.6G 内存，已有中间件）
#
# 复用已有容器（不重复起，省约 600M 内存）：
#   campus-mysql    127.0.0.1:3306  root/123456   （库 spring_cloud 已建好）
#   campus-redis    127.0.0.1:6379  无密码
#   campus-rabbitmq 127.0.0.1:5672  admin/123456
#
# 本文件只起：nacos + 5 个业务服务 + nginx
# 端口：nginx 8081（对外）、gateway 18080（8080 被 campus-api 占用）、其余默认

services:
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: im-nacos
    network_mode: host
    restart: always
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 128m
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  user:
    image: eclipse-temurin:21-jre
    container_name: im-user
    network_mode: host
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./jars/user.jar:/app.jar:ro
    command: ["java", "-Xms128m", "-Xmx192m", "-XX:MaxMetaspaceSize=128m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  auth:
    image: eclipse-temurin:21-jre
    container_name: im-auth
    network_mode: host
    restart: always
    depends_on:
      - user
    volumes:
      - ./jars/auth.jar:/app.jar:ro
    command: ["java", "-Xms128m", "-Xmx192m", "-XX:MaxMetaspaceSize=128m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  im:
    image: eclipse-temurin:21-jre
    container_name: im-im
    network_mode: host
    restart: always
    depends_on:
      - user
    volumes:
      - ./jars/im.jar:/app.jar:ro
    environment:
      # 复用已有 RabbitMQ（账号不是 guest）
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: "123456"
    command: ["java", "-Xms192m", "-Xmx320m", "-XX:MaxMetaspaceSize=160m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  api-gateway:
    image: eclipse-temurin:21-jre
    container_name: im-gateway
    network_mode: host
    restart: always
    depends_on:
      - auth
      - im
    volumes:
      - ./jars/api-gateway.jar:/app.jar:ro
    # 8080 已被 campus-api 占用，网关改用 18080（nginx 已指向它）
    command: ["java", "-Xms128m", "-Xmx256m", "-XX:MaxMetaspaceSize=128m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar", "--server.port=18080"]

  ws-gateway:
    image: eclipse-temurin:21-jre
    container_name: im-ws
    network_mode: host
    restart: always
    depends_on:
      - im
    volumes:
      - ./jars/ws-gateway.jar:/app.jar:ro
    environment:
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: "123456"
    command: ["java", "-Xms128m", "-Xmx256m", "-XX:MaxMetaspaceSize=128m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  web:
    image: nginx:1.27-alpine
    container_name: im-web
    network_mode: host
    restart: always
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
