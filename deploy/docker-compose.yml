services:
  # ==================== 中间件 ====================

  mysql:
    image: mysql:8.0
    container_name: im-mysql
    network_mode: host
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - ./data/mysql:/var/lib/mysql
      # 首次启动自动建表（已存在数据目录时不会重复执行）
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/im_schema.sql:/docker-entrypoint-initdb.d/02-im_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: im-redis
    network_mode: host
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: im-rabbitmq
    network_mode: host
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    # ⚠️ 如果服务器上已有 RabbitMQ 占用 5672/15672，先看 deploy.md「复用已有中间件」

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: im-nacos
    network_mode: host
    restart: always
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - ./data/nacos/logs:/home/nacos/logs

  # ==================== 业务服务 ====================
  # 全部使用 host 网络：配置里的 127.0.0.1 不需要改一个字

  user:
    image: eclipse-temurin:21-jre
    container_name: im-user
    network_mode: host
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./jars/user.jar:/app.jar:ro
    command: ["java", "-Xms128m", "-Xmx256m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  auth:
    image: eclipse-temurin:21-jre
    container_name: im-auth
    network_mode: host
    restart: always
    depends_on:
      - user
      - redis
    volumes:
      - ./jars/auth.jar:/app.jar:ro
    command: ["java", "-Xms128m", "-Xmx256m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  im:
    image: eclipse-temurin:21-jre
    container_name: im-im
    network_mode: host
    restart: always
    depends_on:
      - user
      - redis
      - rabbitmq
    volumes:
      - ./jars/im.jar:/app.jar:ro
    command: ["java", "-Xms192m", "-Xmx384m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  api-gateway:
    image: eclipse-temurin:21-jre
    container_name: im-gateway
    network_mode: host
    restart: always
    depends_on:
      - auth
      - im
    volumes:
      - ./jars/api-gateway.jar:/app.jar:ro
    command: ["java", "-Xms128m", "-Xmx256m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  ws-gateway:
    image: eclipse-temurin:21-jre
    container_name: im-ws
    network_mode: host
    restart: always
    depends_on:
      - im
      - redis
      - rabbitmq
    volumes:
      - ./jars/ws-gateway.jar:/app.jar:ro
    command: ["java", "-Xms128m", "-Xmx256m", "-Duser.timezone=Asia/Shanghai", "-jar", "/app.jar"]

  # ==================== 前端 ====================
  # 只用它对外：82.157.185.69:8081
  # /api  → 127.0.0.1:8080（网关）
  # /ws   → 127.0.0.1:8089（WebSocket）

  web:
    image: nginx:1.27-alpine
    container_name: im-web
    network_mode: host
    restart: always
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
