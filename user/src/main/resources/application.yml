server:
  port: 8084

spring:
  application:
    name: user
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/spring_cloud?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP
        # 本机开发固定注册 127.0.0.1：换 Wi-Fi/VPN 后 IP 变化会导致调用方连不上旧 IP
        ip: 127.0.0.1
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
  # 从 Nacos 配置中心加载 user.yaml；optional: 表示 Nacos 不可用时仍能启动
  config:
    import:
      - optional:nacos:user.yaml

dubbo:
  application:
    name: user
    qos-enable: false
    # 关键：只用接口级注册。应用级注册会把 "user" 注册到 Dubbo 端口(20882)，
    # 与 Spring Cloud 注册的 8084 撞名，导致网关负载均衡打到 Dubbo 端口上
    register-mode: interface
  registry:
    address: nacos://127.0.0.1:8848
  protocol:
    name: dubbo
    port: 20882
    # 本机开发：Dubbo 广播地址固定回环，避免 IP 变化后消费方连不上
    host: 127.0.0.1
  scan:
    base-packages: com.song.user
  consumer:
    check: false
    timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

---
# 没有启动 Nacos 时的本地模式：--spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

dubbo:
  registry:
    address: N/A
