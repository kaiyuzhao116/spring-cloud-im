spring:
  application:
    name: ws-gateway
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

  # 在线表：ws:online:{uid} HASH，field=connId，value=实例地址
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms

# Netty 接入层参数（后续由 NettyServer 读取）
netty:
  port: 8089
  boss-threads: 1
  worker-threads: 0
  heartbeat-idle-seconds: 60
  max-frame-length: 65536

# WS 握手验签：必须与 auth 的 jwt.secret 完全一致
ws:
  jwt:
    secret: spring-cloud-im-demo-jwt-secret-key-please-change-in-prod
  # 业务线程池（承接 Dubbo 调用）：队列满时由 IO 线程自己执行，形成背压
  biz:
    threads: 8
    queue-capacity: 5000

dubbo:
  application:
    name: ws-gateway
    qos-enable: false
    service-discovery:
      migration: FORCE_INTERFACE
  registry:
    address: nacos://127.0.0.1:8848
  protocol:
    name: dubbo
    port: 20885
    # 本机开发：Dubbo 广播地址固定回环，避免 IP 变化后消费方连不上
    host: 127.0.0.1
  consumer:
    check: false
    timeout: 3000
    retries: 0

---
# 没有启动 Nacos 时的本地模式：--spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local

dubbo:
  registry:
    address: N/A
