server:
  port: 8083

spring:
  application:
    name: auth
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 1
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP
        # 本机开发固定注册 127.0.0.1：换 Wi-Fi/VPN 后 IP 变化会导致调用方连不上旧 IP
        ip: 127.0.0.1
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
  # 从 Nacos 配置中心加载 auth.yaml；optional: 表示 Nacos 不可用时仍能启动
  config:
    import:
      - optional:nacos:auth.yaml

# 认证配置：生产环境请把 secret 移到配置中心/KMS，并改用 RS256
jwt:
  secret: spring-cloud-im-demo-jwt-secret-key-please-change-in-prod
  expire-seconds: 1800
  session-ttl-seconds: 604800
  max-fail-count: 5
  fail-window-seconds: 900

dubbo:
  application:
    name: auth
    qos-enable: false
    # 与 user 同理：避免应用级注册与 Spring Cloud 服务名撞车
    register-mode: interface
    service-discovery:
      migration: FORCE_INTERFACE
  registry:
    address: nacos://127.0.0.1:8848
  protocol:
    name: dubbo
    port: 20881
    # 本机开发：Dubbo 广播地址固定回环，避免 IP 变化后消费方连不上
    host: 127.0.0.1
  scan:
    base-packages: com.song.auth
  consumer:
    check: false
    timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

---
# 没有启动 Nacos 时的本地模式：--spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

dubbo:
  registry:
    address: N/A
