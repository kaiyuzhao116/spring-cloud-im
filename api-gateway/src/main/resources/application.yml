server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # 注意：不要在这里用 RemoveRequestHeader 剥身份头。
      # default-filters 在全局过滤器之后执行，会把 AuthGlobalFilter 刚注入的可信头删掉，
      # 导致下游一直报"缺少身份信息"。剥离动作已在 AuthGlobalFilter 内部完成。
      routes:
        - id: auth
          uri: lb://auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        - id: user
          uri: lb://user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: account
          uri: lb://account
          predicates:
            - Path=/api/account/**
          filters:
            - StripPrefix=2

# 网关鉴权配置：secret 必须与 auth 服务一致（生产环境改 RS256 公钥）
gateway:
  auth:
    secret: spring-cloud-im-demo-jwt-secret-key-please-change-in-prod
    white-list:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/sms/code
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
